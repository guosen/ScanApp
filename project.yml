name: ClearScan
options:
  bundleIdPrefix: com.clearscan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
targets:
  ClearScan:
    type: application
    platform: iOS
    sources:
      - path: ClearScan
        excludes:
          - "**/.DS_Store"
    settings:
      PRODUCT_NAME: ClearScan
      PRODUCT_BUNDLE_IDENTIFIER: com.clearscan.app
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: "1"
      INFOPLIST_KEY_CFBundleDisplayName: ClearScan
      INFOPLIST_KEY_NSCameraUsageDescription: "ClearScan uses the camera to scan documents into PDF."
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "ClearScan can import photos to add pages to your scan."
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      GENERATE_INFOPLIST_FILE: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: ClearScan/ClearScan.entitlements
